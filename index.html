<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crypto Portfolio Watchlist</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Crypto Portfolio Watchlist</h1>
        <p>Simple static cryptocurrency portfolio tracker</p>
    </header>

    <main>

        <section class="portfolio">

            <div class="coin">
                <div>
                    <strong>Bitcoin</strong>
                    <span>BTC</span>
                </div>

                <div class="price">
                    $95,200
                </div>
            </div>

            <div class="coin">
                <div>
                    <strong>Ethereum</strong>
                    <span>ETH</span>
                </div>

                <div class="price">
                    $3,450
                </div>
            </div>

            <div class="coin">
                <div>
                    <strong>Solana</strong>
                    <span>SOL</span>
                </div>

                <div class="price">
                    $192
                </div>
            </div>

        </section>

    </main>

    <footer>
        Static educational Web3 project
    </footer>

</body>
</html>
